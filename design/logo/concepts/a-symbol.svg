<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>A: Can it wait</title>
  <!-- short bar = how long it can safely wait; long bar = Earth's reply; the line = where you must act on board.
       The line is drawn over the bars with a clean gap (white keyline), so the long bar visibly runs past it. -->
  <rect x="36" y="78" width="104" height="38" rx="19" fill="#000"/>
  <rect x="36" y="140" width="184" height="38" rx="19" fill="#000"/>
  <rect x="155" y="54" width="14" height="148" rx="7" fill="#000" stroke="#fff" stroke-width="10" paint-order="stroke"/>
</svg>
