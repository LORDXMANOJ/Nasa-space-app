<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>M2: Safe wait and Earth's reply make a heart</title>
  <!-- left bar (safe wait) is shorter than the right bar (Earth's reply); together they make the heart -->
