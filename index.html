<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Offline-first: nothing may load from or talk to the network. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws://localhost:* blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#123631" />
    <meta name="description" content="A one-minute daily health check for astronauts that knows when a problem can wait for Earth, and when it cannot. Runs fully offline." />
    <title>Astronaut Health Monitor</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Hairline kernel (unchanged, from the hairline-create skill) defines window.HL for the 2D body figure. -->
    <script src="./hairline/kernel.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
