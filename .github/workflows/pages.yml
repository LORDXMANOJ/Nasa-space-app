# Publishes the site to GitHub Pages: the download page (site/), the 7-slide deck (site/deck/) and the live web
# version of the app with Demo mode (built into site/app/).
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "public/**", "index.html", "package.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Put the web app at /app/
        run: |
          mkdir -p site/app
          cp -r dist/. site/app/
          cp public/icon.svg site/icon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
